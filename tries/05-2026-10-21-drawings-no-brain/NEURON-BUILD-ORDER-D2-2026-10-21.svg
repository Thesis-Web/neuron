00000" width="313.000000" height="114.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="299.500000" y="38.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="299.500000" dy="0.000000">1. the skull</tspan><tspan x="299.500000" dy="17.250000">about 12 told tables and their triggers</tspan><tspan x="299.500000" dy="17.250000">laid as one block</tspan><tspan x="299.500000" dy="17.250000">nothing fires yet</tspan></text></g><g class="czI="><g class="shape" ><rect x="698.000000" y="0.000000" width="353.000000" height="114.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="874.500000" y="38.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="874.500000" dy="0.000000">2. the SQL words</tspan><tspan x="874.500000" dy="17.250000">one typed line births</tspan><tspan x="874.500000" dy="17.250000">CREATE TABLE ( ) ; INTEGER PRIMARY KEY ...</tspan><tspan x="874.500000" dy="17.250000">nobody hand-lays CREATE</tspan></text></g><g class="czM="><g class="shape" ><rect x="1151.000000" y="0.000000" width="343.000000" height="114.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1322.500000" y="38.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1322.500000" dy="0.000000">3. born as a word run</tspan><tspan x="1322.500000" dy="17.250000">a formula node with holes</tspan><tspan x="1322.500000" dy="17.250000">the new word fills the hole, lands at BUILD</tspan><tspan x="1322.500000" dy="17.250000">born&#39;s canned text goes away</tspan></text></g><g class="czQ="><g class="shape" ><rect x="1594.000000" y="0.000000" width="464.000000" height="114.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1826.000000" y="38.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1826.000000" dy="0.000000">4. sources</tspan><tspan x="1826.000000" dy="17.250000">source() beside mother</tspan><tspan x="1826.000000" dy="17.250000">born fills the definition node</tspan><tspan x="1826.000000" dy="17.250000">the definition text runs; the meaning questions start (open)</tspan></text></g><g class="czU="><g class="shape" ><rect x="2158.000000" y="8.000000" width="399.000000" height="98.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="2357.500000" y="46.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="2357.500000" dy="0.000000">5. makes sense, at root level</tspan><tspan x="2357.500000" dy="17.666667">same as last time? equal to the expected output?</tspan><tspan x="2357.500000" dy="17.666667">right, wrong or unchecked written on the memory</tspan></text></g><g class="czY="><g class="shape" ><rect x="2657.000000" y="8.000000" width="463.000000" height="98.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="2888.500000" y="46.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="2888.500000" dy="0.000000">6. back population</tspan><tspan x="2888.500000" dy="17.666667">a told piece gets its word-run form</tspan><tspan x="2888.500000" dy="17.666667">receipts re-pointed, the old form kept as the earlier version</tspan></text></g><g class="d2h5"><g class="shape" ><rect x="0.000000" y="174.000000" width="598.000000" height="98.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B2 fill-B6" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" /></g><text x="299.000000" y="212.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="299.000000" dy="0.000000">why this order is free</tspan><tspan x="299.000000" dy="17.666667">a trigger can be written before the table it lands in exists (verified today)</tspan><tspan x="299.000000" dy="17.666667">laying is unconstrained; only firing is, and firing is what the typed lines control</tspan></text></g><g class="KHMxIC0mZ3Q7IHMyKVswXQ=="><marker id="mk-d2-504776679-3488378134" markerWidth="10.000000" markerHeight="12.000000" refX="7.000000" refY="6.000000" viewBox="0.000000 0.000000 10.000000 12.000000" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0.000000,0.000000 10.000000,6.000000 0.000000,12.000000" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 458.500000 57.000000 C 609.700012 57.000000 658.000000 57.000000 694.000000 57.000000" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-504776679-3488378134)" mask="url(#d2-504776679)" /></g><g class="KHMyIC0mZ3Q7IHMzKVswXQ=="><path d="M 1053.000000 57.000000 C 1091.000000 57.000000 1111.000000 57.000000 1147.000000 57.000000" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-504776679-3488378134)" mask="url(#d2-504776679)" /></g><g class="KHMzIC0mZ3Q7IHM0KVswXQ=="><path d="M 1496.000000 57.000000 C 1534.000000 57.000000 1554.000000 57.000000 1590.000000 57.000000" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-504776679-3488378134)" mask="url(#d2-504776679)" /></g><g class="KHM0IC0mZ3Q7IHM1KVswXQ=="><path d="M 2060.000000 57.000000 C 2098.000000 57.000000 2118.000000 57.000000 2154.000000 57.000000" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-504776679-3488378134)" mask="url(#d2-504776679)" /></g><g class="KHM1IC0mZ3Q7IHM2KVswXQ=="><path d="M 2559.000000 57.000000 C 2597.000000 57.000000 2617.000000 57.000000 2653.000000 57.000000" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2